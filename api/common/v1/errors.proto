syntax = "proto3";

package common.v1;

option go_package = "github.com/flexer2006/notes-microservices/gen/common/v1;commonv1";

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_UNAVAILABLE = 6;
  ERROR_CODE_INTERNAL = 7;
}


message ErrorResponse {
  int32 status = 1;
  ErrorCode code = 2;
  string message = 3;
}
